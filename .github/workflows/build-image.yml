name: Universal Docker Image Builder and Exporter

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to checkout"
        required: true
        default: "main"
        type: string

      context_path:
        description: "Path to the build context (directory containing Dockerfile and app code)"
        required: true
        default: "."
        type: string

      dockerfile_path:
        description: "Path to the Dockerfile relative to context_path"
        required: true
        default: "Dockerfile"
        type: string

      image_name:
        description: "Desired name for the resulting Docker image (e.g., my-app)"
        required: true
        default: "my-custom-app"
        type: string

      image_tag:
        description: "Desired tag for the resulting Docker image (e.g., latest or v1.0.0)"
        required: true
        default: "latest"
        type: string

jobs:
  build_and_export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate names
        id: names
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REF="${{ inputs.image_name }}:${{ inputs.image_tag }}"
          SAFE_NAME=$(echo "$IMAGE_REF" | sed 's/[^a-zA-Z0-9_.-]/_/g')
          TAR_FILE="/tmp/${SAFE_NAME}.tar"

          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "SAFE_NAME=$SAFE_NAME" >> "$GITHUB_OUTPUT"
          echo "TAR_FILE=$TAR_FILE" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context_path }}
          file: ${{ inputs.context_path }}/${{ inputs.dockerfile_path }}
          push: false
          load: true
          tags: ${{ steps.names.outputs.IMAGE_REF }}

      - name: Save Docker image
        shell: bash
        run: |
          set -euo pipefail

          docker image inspect "${{ steps.names.outputs.IMAGE_REF }}"
          docker save \
            -o "${{ steps.names.outputs.TAR_FILE }}" \
            "${{ steps.names.outputs.IMAGE_REF }}"

          ls -lh "${{ steps.names.outputs.TAR_FILE }}"

      - name: Upload Docker Image Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ steps.names.outputs.SAFE_NAME }}
          path: ${{ steps.names.outputs.TAR_FILE }}
          retention-days: 1
